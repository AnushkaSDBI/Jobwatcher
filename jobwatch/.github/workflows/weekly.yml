name: weekly-collect-and-deploy
on:
  schedule: [{ cron: '17 5 * * 1' }]   # Mondays 05:17 UTC
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: jobwatch, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/run.mjs            # offline tests must pass before touching live data
      - run: node collect.mjs
      - run: node llm-classify.mjs
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }
      - run: node build-site.mjs
      - name: Commit state (history lives in the repo)
        run: |
          git config user.name "jobwatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/state.json && git commit -m "snapshot $(date -u +%F)" || echo "nothing to commit"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
