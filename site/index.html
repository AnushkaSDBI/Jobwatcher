@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f3f6f4; --panel:#ffffff; --panel2:#f7faf8; --line:#d9e3de; --text:#14211b; --muted:#5d7167;
    --accent:#17805a; --accent-ink:#ffffff; --neg:#bf4f46; --add:#a9d9c2; --sel:#e8f3ee; --focus:#17805a; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:#f3f6f4; --panel:#ffffff; --panel2:#f7faf8; --line:#d9e3de; --text:#14211b; --muted:#5d7167;
  --accent:#17805a; --accent-ink:#ffffff; --neg:#bf4f46; --add:#a9d9c2; --sel:#e8f3ee; --focus:#17805a; color-scheme: light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--accent)} .neg{color:var(--neg)} .flat{color:var(--muted)}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}

.beta{font:600 11px var(--mono);letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--sel);color:var(--accent);border:1px solid var(--line)}
nav.pages{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.pg{border:1px solid transparent;background:none;padding:8px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600}
.pg:hover{color:var(--text)}
.pg[aria-current="page"]{background:var(--sel);color:var(--accent);border-color:var(--line)}
.theme{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer}

.domains{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}

.live{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin:12px 0}

.controls{display:grid;grid-template-columns:minmax(180px,1fr) auto auto auto;gap:8px;align-items:stretch}

.ctl.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.ctl.search:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.ctl.search span{color:var(--muted);font-size:13px;white-space:nowrap}
select.ctl{cursor:pointer;font-weight:600;background:var(--panel)}
button.ctl{cursor:pointer;font-weight:600}
button.ctl.on{background:var(--sel);color:var(--accent);border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--accent)}

.tablewrap{margin-top:12px;overflow-x:auto;border-top:1px solid var(--line)}
.tbl{min-width:820px}

.r{text-align:right}

.plot{position:relative;align-self:stretch;padding:0 !important}

   linear-gradient(var(--line),var(--line)) 0 0/1px 100% no-repeat,

.dot.p{background:var(--accent)} .dot.n{background:var(--neg)}

.job{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}

footer{margin-top:28px;color:var(--muted);font-size:13px;max-width:80ch}

</style>

  return '<h1 id="stitle">How German employers’ new postings changed between <span class="chip">'+fd(END-(2*N*7-1)*DAY)+'</span> and <span class="chip">'+fd(END)+'</span></h1>'+
   '<p class="lead"><span class="live">Real data</span> &nbsp;Change compares postings first listed in the last '+N+' weeks with the '+N+' weeks before. It counts new postings, not net open jobs, because the source does not show when a posting is removed. <b>Caution:</b> weekly counts only include postings still open today, so older weeks look smaller than they were. Compare employers with each other, not the market over time.</p>'+
   '<div class="cols"><div class="card"><h3>New postings per week</h3>'+bars(D.wk,13-N)+'<p class="note">Last '+N+' weeks: '+nf(tot.r)+' ('+(tot.d>=0?"+":"−")+nf(Math.abs(tot.d))+' vs '+nf(tot.p)+' before). '+nf(D.older)+' postings were first listed before this window, usually reposted.</p></div>'+
   '<div class="card"><h3>By state</h3>'+hbars(st)+'</div>'+
   '<div class="card"><h3>Most common roles</h3>'+hbars(D.titles.slice(0,8))+'</div>'+
   '<div class="card"><h3>What the postings say</h3><div class="meters">'+m("Entry level, student or intern",D.flags.entry)+m("Home office possible",D.flags.h)+m("Full-time",D.flags.v)+m("Fixed-term",D.flags.b)+m("German-language title (inferred)",D.flags.de)+'</div></div></div>'+
   histBlock()+
   '<div class="controls" style="grid-template-columns:minmax(180px,1fr) auto auto;margin-top:16px"><label class="ctl search"><input id="sq" type="search" placeholder="Search employers…" value="'+esc(S.q)+'" aria-label="Search employers"><span>'+L.length+' companies</span></label>'+
   '<select class="ctl" data-sw="1" aria-label="Time range">'+[1,2,3,4,6].map(function(w){return '<option value="'+w+'"'+(N===w?" selected":"")+'>'+w+(w===1?" week":" weeks")+'</option>'}).join("")+'</select>'+
   '<select class="ctl" data-ss="1" aria-label="Sort by"><option value="jobs"'+(S.sort==="jobs"?" selected":"")+'>Postings ↓</option><option value="new"'+(S.sort==="new"?" selected":"")+'>New postings ↓</option><option value="gain"'+(S.sort==="gain"?" selected":"")+'>Biggest gain ↓</option><option value="drop"'+(S.sort==="drop"?" selected":"")+'>Biggest drop ↑</option><option value="pct"'+(S.sort==="pct"?" selected":"")+'>Change % ↓</option></select></div>'+
   '<div class="tablewrap"><div class="tbl">'+out+'</div></div>';
}

/* ---------- Thesis ---------- */
function pThesis(){
  var T=D0.thesis[S.dom],t=S.t,q=t.q.toLowerCase(),dm=DOM[S.dom];
  var R=T.rows.filter(function(j){
    if(q&&(j[1]+" "+j[2]+" "+j[3]).toLowerCase().indexOf(q)<0)return false;
    if(t.lv==="master"&&!/master/i.test(j[1]))return false;
    if(t.lv==="bachelor"&&!/bachelor/i.test(j[1]))return false;
    if(t.state!=="all"&&String(j[6])!==t.state)return false;
    return true});
  var mast=T.rows.filter(function(j){return /master/i.test(j[1])}).length,bach=T.rows.filter(function(j){return /bachelor/i.test(j[1])}).length;
  var last4=T.wk.slice(9).reduce(function(a,b){return a+b},0);
  var co={};T.rows.forEach(function(j){co[j[2]]=(co[j[2]]||0)+1});
  var top=Object.keys(co).map(function(k){return [k,co[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,8);
  var st=D0.states.map(function(n,i){return [n,T.rows.filter(function(j){return j[6]===i}).length]}).filter(function(x){return x[1]}).sort(function(a,b){return b[1]-a[1]}).slice(0,8);
  var sts=D0.states.map(function(s2,i){return '<option value="'+i+'"'+(t.state===String(i)?" selected":"")+'>'+esc(s2)+'</option>'}).join("");
  function lv(k,l){return '<button data-act="lv-'+k+'" aria-pressed="'+(t.lv===k)+'">'+l+'</button>'}
  return '<section class="hero"><p class="eyebrow">'+esc(dm.label)+' · thesis and final-project postings</p><h1>Thesis topics in '+esc(dm.scope)+'</h1>'+
   '<p class="lead"><span class="live">Real data</span> &nbsp;'+nf(T.total)+' postings from '+nf(T.nCompanies)+' employers whose title says Masterarbeit, Bachelorarbeit, Abschlussarbeit or thesis. Same source and date as the rest of the site. The list is complete for this search, not capped at 400.</p></section>'+
   '<div class="kpis"><div class="kpi"><small>Thesis postings</small><strong>'+nf(T.total)+'</strong><em>open on '+fd(END)+'</em></div>'+
   '<div class="kpi"><small>Master</small><strong>'+nf(mast)+'</strong><em>title mentions Master</em></div>'+
   '<div class="kpi"><small>Bachelor</small><strong>'+nf(bach)+'</strong><em>title mentions Bachelor</em></div>'+
   '<div class="kpi"><small>First listed, last 4 weeks</small><strong>'+nf(last4)+'</strong><em>'+nf(T.older)+' were listed earlier</em></div></div>'+
   '<div class="cols"><div class="card"><h3>Employers with the most thesis postings</h3>'+hbars(top)+'</div><div class="card"><h3>By state</h3>'+hbars(st)+'</div></div>'+
   '<div class="controls" style="grid-template-columns:minmax(180px,1fr) auto auto;margin-top:16px"><label class="ctl search"><input id="tq" type="search" placeholder="Search topic, company or city…" value="'+esc(t.q)+'" aria-label="Search thesis postings"><span>'+R.length+' of '+T.rows.length+' postings</span></label>'+
   '<div class="seg" role="group" aria-label="Level">'+lv("all","All")+lv("master","Master")+lv("bachelor","Bachelor")+'</div>'+
   '<select class="ctl" data-ts="1" aria-label="State"><option value="all">All of Germany</option>'+sts+'</select></div>'+
   '<div class="cols" style="margin-top:12px">'+(R.length?R.slice(0,t.shown).map(jobCard).join(""):'<div class="empty">No thesis postings match these filters.</div>')+'</div>'+
   (R.length>t.shown?'<p><button class="btn more" data-act="tmore">Show more</button></p>':"")+
   '<p class="hint">Domain is assigned by keywords in the title and occupation, so some topics only loosely fit. Postings that mention both domains show in both. Employers can list a thesis as an internship or student job without the word thesis in the title; those are missed. Every link opens the original listing on arbeitsagentur.de.</p>';
}

/* ---------- Data ---------- */
function pData(){
  var M=D0.meta,A=D0.dom.a,B=D0.dom.b;
  return '<section class="hero"><p class="eyebrow">Data handling</p><h1>Where these numbers come from</h1><p class="lead">Every posting on this site is a real listing from the public job board of the German Federal Employment Agency (Bundesagentur für Arbeit). Nothing is simulated, and nothing about you is collected.</p></section>'+
   '<div class="dgrid"><div class="card dcard"><small>Source</small><h3>Bundesagentur für Arbeit</h3><p>The Jobsuche service behind arbeitsagentur.de. It lists postings that employers and agencies publish there, so it is not the whole market. Platforms such as LinkedIn are not included.</p></div>'+
   '<div class="card dcard"><small>Snapshot</small><h3>'+fd(END)+'</h3><p>'+M.queries+' searches, each limited to postings from the last '+M.windowDays+' days and to Germany. '+nf(M.raw)+' unique postings came back, '+nf(M.kept)+' passed the role filter ('+nf(A.total)+' for Data &amp; AI, '+nf(B.total)+' for Industry 4.0 &amp; Robotics).</p></div></div>'+
   '<div class="sect"><h2>What the numbers mean</h2><div class="dgrid">'+
   '<div class="card dcard"><small>Postings found</small><h3>Open listings</h3><p>Distinct postings in the snapshot. A posting that matches both domains counts in both.</p></div>'+
   '<div class="card dcard"><small>New postings</small><h3>By first listing date</h3><p>Weeks run Tuesday to Monday ending '+fd(END)+'. The date is when the Agency first listed the posting.</p></div>'+
   '<div class="card dcard"><small>Change</small><h3>Recent vs earlier</h3><p>New postings in the last N weeks minus the N weeks before. It shows hiring pace, not the count of open jobs.</p></div></div></div>'+
   '<div class="sect"><h2>What it misses</h2><ul class="lim">'+
   '<li><b>Survivorship bias.</b> Weekly counts only include postings that are still open today. Older weeks therefore look smaller than they really were, and the recent rise is partly an artefact. Compare employers with each other, not the market over time.</li>'+
   '<li><b>History.</b> '+((D0.history&&D0.history.runs.length>1)?D0.history.runs.length+' weekly snapshots recorded, so closed postings and net change are real. ':'Only one snapshot so far, so removals and filled jobs are invisible. ')+'Closure needs two consecutive missed runs because searches are capped at 500 per term.</li>'+
   '<li><b>CV match and German-required.</b> Match is keyword overlap with profile.json, not a judgement of fit. German-required is read from the posting text for the newest postings; where no text was fetched it falls back to the title guess.</li>'+
   '<li><b>Staffing firms.</b> Known staffing and recruiting firms are tagged, not removed. The list is a regex and incomplete.</li>'+
   '<li><b>Capped searches.</b> Each search returns at most 500 postings, so broad terms are cut off. Totals are lower bounds.</li>'+
   '<li><b>Keyword filter.</b> Roles are chosen by words in the title, so some false hits and misses remain. Apprenticeships are excluded.</li>'+
   '<li><b>Reposts.</b> Employers that repost keep an older first-listing date. '+nf(A.older)+' (Data &amp; AI) and '+nf(B.older)+' (Industry 4.0 &amp; Robotics) postings fall before the 13-week window.</li>'+
   '<li><b>Employer names.</b> Legal suffixes and branch names are trimmed to group postings, which can merge or split a few companies. Staffing firms appear under their own name.</li>'+
   '<li><b>Locations.</b> Cities were placed with OpenStreetMap Nominatim for the 260 busiest cities. Others use the average of their postcode area, so those squares are approximate.</li>'+
   '<li><b>Language and level.</b> "German-language title" and "Entry level" are inferred from the title text, not stated by the employer.</li>'+
   '<li><b>Thesis page.</b> '+nf(D0.thesis.a.total)+' (Data &amp; AI) and '+nf(D0.thesis.b.total)+' (Industry 4.0 &amp; Robotics) postings whose title contains Masterarbeit, Bachelorarbeit, Abschlussarbeit or thesis, found with '+135+' searches. Titles from the source are sometimes cut off by the Agency itself.</li>'+
   '<li><b>List size.</b> The Hiring map list holds the newest 400 postings per domain. Company pages link to the full listing on arbeitsagentur.de.</li>'+
   '<li><b>Not shown.</b> Ratings, industry, company size and salary are not in the source, so they are left out instead of guessed.</li></ul></div>'+
   '<div class="sect"><h2>Your data</h2><div class="dgrid"><div class="card dcard"><small>Visitors</small><h3>Nothing is collected</h3><p>This page has no accounts, no analytics and no tracking. Theme and filters are not stored. Saved, applied and rejected marks stay in this browser only.</p></div><div class="card dcard"><small>Links</small><h3>Opens the original</h3><p>Job and company links open arbeitsagentur.de in a new tab. This site is not affiliated with the Agency or any employer.</p></div></div></div>';
}

/* ---------- My jobs ---------- */
function pMine(){
  var all={};D0.jobs.forEach(function(j){all[j[0]]=j});["a","b"].forEach(function(k){D0.thesis[k].rows.forEach(function(j){all[j[0]]=j})});
  var groups=[["applied","Applied"],["saved","Saved"],["rejected","Rejected"]],n=Object.keys(TR).length,out="";
  groups.forEach(function(g){var refs=Object.keys(TR).filter(function(r){return TR[r]===g[0]});if(!refs.length)return;
    out+='<h2 style="margin:22px 0 8px">'+g[1]+' ('+refs.length+')</h2><div class="listcol">'+refs.map(function(r){var j=all[r];
      return j?jobCard(j):r.indexOf(":")>0?'<article class="job"><b>Posting '+esc(r)+'</b><div class="loc">No longer in the newest listed postings.</div><div class="trrow"><button class="trb on" data-tr="'+esc(r)+'|'+g[0]+'">Remove</button></div></article>':'<article class="job"><a class="t" href="'+jobUrl(r)+'" target="_blank" rel="noopener">Posting '+esc(r)+' ↗</a><div class="loc">No longer in the newest listed postings. The link may still work or the posting may have closed.</div><div class="trrow"><button class="trb on" data-tr="'+esc(r)+'|'+g[0]+'">Remove</button></div></article>'}).join("")+'</div>'});
  return '<section class="hero"><h1>My jobs</h1><p class="lead">Your saved, applied and rejected postings. They are kept in this browser only: no account, nothing is uploaded. Clearing site data or switching browser starts a fresh list.</p></section>'+(n?out:'<div class="empty">Nothing yet. Use Save, Applied or Reject on any posting card.</div>');
}
/* ---------- History ---------- */
function histBlock(){
  var H=(D0.history||{runs:[]}),R=H.runs||[];
  if(R.length<2)return '<div class="card" style="margin-top:16px"><h3>Real history</h3><p class="note">'+(R.length?'One snapshot so far ('+esc(R[0].date)+').':'No weekly snapshots recorded yet.')+' Net change, filled and removed postings need at least two weekly runs of the collector. This section fills in on its own; until then, nothing is estimated.</p></div>';
  var k=S.dom,v=R.map(function(r){return r[k]}),last=R[R.length-1],prev=R[R.length-2];
  var rows=R.slice().reverse().slice(0,12).map(function(r){return '<div class="hrow"><span>'+esc(r.date)+'</span><b class="num">'+nf(r[k])+'</b><span class="num">+'+nf(r.added)+' new</span><span class="num">−'+nf(r.closed)+' closed'+(r.complete?"":" (run incomplete)")+'</span></div>'}).join("");
  return '<div class="card" style="margin-top:16px"><h3>Open postings by weekly snapshot</h3>'+bars(v,v.length-1)+'<p class="note">Since '+esc(prev.date)+': '+(last[k]-prev[k]>=0?"+":"−")+nf(Math.abs(last[k]-prev[k]))+' open postings. A posting counts as closed only after it is missing in two consecutive runs.</p><div class="hist">'+rows+'</div></div>';
}
/* ---------- Shell ---------- */
function shell(){
  $("nav").innerHTML=PAGES.map(function(p){return '<button class="pg" data-go="'+p[0]+'"'+(S.page===p[0]?' aria-current="page"':"")+'>'+p[1]+'</button>'}).join("");
  $("domains").innerHTML=["a","b"].map(function(k){return '<button class="dm" data-dom="'+k+'" aria-pressed="'+(S.dom===k)+'"><b>'+esc(DOM[k].label)+'</b><span>'+nf(D0.dom[k].total)+' postings · '+nf(D0.dom[k].nCompanies)+' employers</span></button>'}).join("");
  $("foot").innerHTML='Source: Bundesagentur für Arbeit Jobsuche, snapshot '+fd(END)+'. Real postings, collected live; see the Data page for method and limits.';
}
function render(top){
  var ae=document.activeElement,id=ae&&ae.id,ss=ae&&ae.selectionStart;
  shell();
  $("app").innerHTML={home:pHome,map:pMap,companies:pCompanies,stats:pStats,thesis:pThesis,mine:pMine,data:pData}[S.page]();
  if(top)window.scrollTo(0,0);
  if(id&&$(id)){$(id).focus();try{$(id).setSelectionRange(ss,ss)}catch(e){}}
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-dom],[data-co],[data-view],[data-f],[data-act],[data-tr]");if(!t)return;
  if(t.dataset.tr){var q=t.dataset.tr.split("|");trSet(q[0],q[1]);render();return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.dom){S.f=Object.assign({},S.f,{role:"all",co:"all",cell:null});go(null,t.dataset.dom);return}
  if(t.dataset.co!==undefined){S.open=S.open===t.dataset.co?null:t.dataset.co;render();return}
  if(t.dataset.view){S.view=t.dataset.view;render();return}
  if(t.dataset.f){S.f[t.dataset.f]=t.dataset.v;S.f.cell=null;S.shown=40;render();return}
  var a=t.dataset.act;
  if(a==="filters")S.fOpen=!S.fOpen;
  else if(a==="remote"){S.f.remote=!S.f.remote;S.shown=40}
  else if(a==="reset"){S.f={role:"all",sen:"all",date:"all",state:"all",de:"all",co:"all",remote:false,cell:null,q:"",staff:"",mm:"0"};S.shown=40}
  else if(a==="cov")S.cov=!S.cov;
  else if(a==="more")S.shown+=40;
  else if(a==="tmore")S.t.shown+=40;
  else if(a&&a.indexOf("lv-")===0){S.t.lv=a.slice(3);S.t.shown=40}
  else if(a==="clearcell")S.f.cell=null;
  render();
});
document.addEventListener("click",function(e){var c=e.target.closest&&e.target.closest("rect.cell");if(!c)return;var p=c.dataset.cell.split(",").map(Number);S.f.cell=(S.f.cell&&S.f.cell[0]===p[0]&&S.f.cell[1]===p[1])?null:p;S.shown=40;render()});
document.addEventListener("input",function(e){var t=e.target;if(t.id==="mq"){S.f.q=t.value;S.f.cell=null;S.shown=40;render()}else if(t.id==="cq"){S.cq=t.value;render()}else if(t.id==="sq"){S.q=t.value;render()}else if(t.id==="tq"){S.t.q=t.value;S.t.shown=40;render()}});
document.addEventListener("change",function(e){var t=e.target;if(t.dataset.fs){S.f[t.dataset.fs]=t.value;S.f.cell=null;S.shown=40}else if(t.dataset.cs)S.csort=t.value;else if(t.dataset.ts){S.t.state=t.value;S.t.shown=40}else if(t.dataset.sw)S.weeks=+t.value;else if(t.dataset.ss)S.sort=t.value;else return;render()});
document.addEventListener("mousemove",function(e){var tip=$("tip"),c=e.target.closest&&e.target.closest("rect.cell");if(!tip)return;if(!c){tip.hidden=true;return}var b=c.closest(".mapbox").getBoundingClientRect();tip.hidden=false;tip.textContent=c.dataset.n+(c.dataset.n==="1"?" posting":" postings")+" in this area";tip.style.left=Math.min(e.clientX-b.left+12,b.width-170)+"px";tip.style.top=(e.clientY-b.top+12)+"px"});
$("theme").addEventListener("click",function(){var r=document.documentElement,c=r.getAttribute("data-theme");if(!c)c=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";r.setAttribute("data-theme",c==="dark"?"light":"dark")});
window.addEventListener("hashchange",function(){parseHash();render(true)});
parseHash();render();
})();
</script>
